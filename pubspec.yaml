name: nhs_tracker
description: Wheeler NHS Hour Tracker

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+26

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  animate_do: ^4.2.0
  english_words: ^4.0.0
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  provider: ^6.0.0
  credential_manager: ^0.0.4
  bottom_navy_bar: ^6.0.0
  flutter_colorpicker: ^1.0.3
  url_launcher: ^6.2.6
  shared_preferences: ^2.0.15
  add_2_calendar: ^3.0.1
  animations: ^2.0.11
  toastification: ^2.0.0
  barcode: ^2.2.8
  mobile_scanner: ^5.2.3
  barcode_widget: ^2.0.3
  intl: ^0.19.0
  excel: ^4.0.6
  path_provider: ^2.1.1
  image_picker: ^1.1.2
  supabase_auth_ui: ^0.5.4
  google_fonts: ^6.2.1
  path_drawing: ^1.0.1
  loading_animation_widget: ^1.3.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: "^0.13.1"
  


flutter_native_splash:
  color: "#ffffff"
  image: assets/nhs-logo-simple.png
  color_dark: "#121212"
  image_dark: assets/nhs-logo-simple.png
  
  android_12:
    image: assets/nhs-logo-simple.png
    icon_background_color: "#ffffff"
    image_dark: assets/nhs-logo-simple.png
    icon_background_color_dark: "#121212"
    
  web: true
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/nhsicon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/nhsicon.png"
  windows:
    generate: true
    image_path: "assets/nhsicon.png"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/nhsicon.png"

    
flutter:
  uses-material-design: true